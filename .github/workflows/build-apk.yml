name: Build Android APK & Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk main.py

      - name: Get changelog for release body
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "## Release Notes for $LATEST_TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Full changelog available in CHANGELOG.md" >> release_notes.md
          {
            echo 'content<<EOF'
            cat release_notes.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
        id: get_changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
          body_path: "release_notes.md" # We use the generated notes
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}