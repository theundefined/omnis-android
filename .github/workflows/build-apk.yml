name: Build Android APK & Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create a release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1' # Flet works well with this or newer

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      - name: Build APK
        run: |
          flet build apk --module-name main

      - name: Get changelog for release body
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "## Release Notes for $LATEST_TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Full changelog available in CHANGELOG.md" >> release_notes.md
        id: get_changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/apk/*.apk
          body_path: "release_notes.md"
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
