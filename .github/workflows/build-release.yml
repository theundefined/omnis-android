name: Build Android Release (APK & AAB)

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install flet
          pip install -r requirements.txt

      # --- KEYSTORE PREPARATION ---
      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > release-key.jks

      # --- APK SECTION ---
      - name: Build APK
        run: |
          yes | flet build apk --module-name main

      - name: Sign APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Find latest build tools
          BUILD_TOOLS_VERSION=$(ls $ANDROID_HOME/build-tools/ | sort -V | tail -n 1)
          ANDROID_APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          ANDROID_ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/zipalign"
          
          echo "Using Build Tools: $BUILD_TOOLS_VERSION"
          
          # Debug: List files to ensure we know the name
          echo "Files in build/apk:"
          ls -R build/apk/
          
          # Find the APK file (it might be app-release.apk or similar)
          APK_FILE=$(find build/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          
          # Align the APK (Optimization)
          $ANDROID_ZIPALIGN -v -p 4 "$APK_FILE" build/apk/app-release-aligned.apk
          
          # Sign the APK
          $ANDROID_APKSIGNER sign \
            --ks release-key.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out build/apk/app-release-signed.apk \
            build/apk/app-release-aligned.apk

      # --- AAB SECTION ---
      - name: Build AAB
        run: |
          yes | flet build aab --module-name main

      - name: Sign AAB
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          # Debug: List files
          echo "Files in build/aab:"
          ls -R build/aab/
          
          # Find the AAB file
          AAB_FILE=$(find build/aab -name "*.aab" | head -n 1)
          echo "Found AAB: $AAB_FILE"
          
          # Sign the AAB using jarsigner (standard for AAB)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release-key.jks \
            -storepass "$ANDROID_STORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            "$AAB_FILE" "$ANDROID_KEY_ALIAS"
            
          # Rename/Move for consistency if needed, or just use the signed file directly
          mv "$AAB_FILE" build/aab/app-release-signed.aab

      # --- RELEASE SECTION ---
      - name: Get changelog for release body
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)
          echo "## Release Notes for $LATEST_TAG" > release_notes.md
          echo "" >> release_notes.md
          echo "Full changelog available in CHANGELOG.md" >> release_notes.md
        id: get_changelog

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/apk/app-release-signed.apk
            build/aab/app-release-signed.aab
          body_path: "release_notes.md"
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      # Clean up keystore
      - name: Cleanup Keystore
        if: always()
        run: rm -f release-key.jks